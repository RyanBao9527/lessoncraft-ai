    <text x="82" y="340" xml:space="preserve" font-family="Menlo, Consolas, Courier New, Microsoft YaHei, monospace" font-size="22" fill="#FFFFFF"> 5      guess = int(input("请输入 1～10 的数字："))</text>
    <text x="82" y="374" xml:space="preserve" font-family="Menlo, Consolas, Courier New, Microsoft YaHei, monospace" font-size="22" fill="#8FE0B8"> 6      if guess &lt; answer:</text>
    <text x="82" y="408" xml:space="preserve" font-family="Menlo, Consolas, Courier New, Microsoft YaHei, monospace" font-size="22" fill="#FFFFFF"> 7          print("太小了")</text>
    <text x="82" y="442" xml:space="preserve" font-family="Menlo, Consolas, Courier New, Microsoft YaHei, monospace" font-size="22" fill="#8FE0B8"> 8      elif guess &gt; answer:</text>
    <text x="82" y="476" xml:space="preserve" font-family="Menlo, Consolas, Courier New, Microsoft YaHei, monospace" font-size="22" fill="#FFFFFF"> 9          print("太大了")</text>
    <text x="82" y="510" xml:space="preserve" font-family="Menlo, Consolas, Courier New, Microsoft YaHei, monospace" font-size="22" fill="#FFFFFF">10  </text>
    <text x="82" y="544" xml:space="preserve" font-family="Menlo, Consolas, Courier New, Microsoft YaHei, monospace" font-size="22" font-weight="700" fill="#FFC444">11  print("猜对了！")</text>
