    <text x="82" y="204" xml:space="preserve" font-family="Menlo, Consolas, Courier New, Microsoft YaHei, monospace" font-size="22" fill="#FFFFFF"> 1  answer = 7</text>
    <text x="82" y="238" xml:space="preserve" font-family="Menlo, Consolas, Courier New, Microsoft YaHei, monospace" font-size="22" fill="#FFFFFF"> 2  guess = 0</text>
    <text x="82" y="272" xml:space="preserve" font-family="Menlo, Consolas, Courier New, Microsoft YaHei, monospace" font-size="22" fill="#FFFFFF"> 3  </text>
    <text x="82" y="306" xml:space="preserve" font-family="Menlo, Consolas, Courier New, Microsoft YaHei, monospace" font-size="22" font-weight="700" fill="#FFC444"> 4  while guess != answer:</text>
